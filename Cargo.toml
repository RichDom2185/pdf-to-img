[package]
name = "pdf-to-jpg"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
hayro = "0.4.0"
hayro-svg = "0.2.0"
image = "0.25.9"
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3.83", features = ["Blob", "BlobPropertyBag", "console"] }
web-time = "1.1.0"
zip = { version = "6.0.0", default-features = false }
